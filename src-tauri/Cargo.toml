[package]
name = "mochi-garden"
version = "0.1.2"
description = "Mochi Garden: your Claude Code sessions as a growing pixel garden"
license = "MIT"
edition = "2021"

[lib]
name = "mochi_garden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
portable-pty = "0.9"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tauri-plugin-updater = "2"
